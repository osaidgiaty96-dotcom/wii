<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSAID | Secure Area</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        /* --- صندوق تسجيل الدخول --- */
        .login-box {
            background: #111;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            border: 1px solid #333;
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: 0.5s;
        }
        .login-box h2 { color: #00ffcc; margin-bottom: 30px; text-shadow: 0 0 10px #00ffcc; }
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 0.9rem; }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }
        .input-group input:focus { outline: none; border-color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
        .btn {
            width: 100%;
            padding: 12px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 20px #00ffcc; }

        /* --- شاشة النجاح --- */
        .success-screen {
            display: none;
            text-align: center;
            animation: zoomIn 0.5s ease;
        }
        .success-screen h1 {
            color: #00ffcc;
            font-size: 4rem;
            text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
            margin-bottom: 20px;
        }
        .success-screen p { color: #fff; font-size: 1.5rem; }

        /* --- اللعبة --- */
        .game-screen { display: none; text-align: center; }
        .game-screen h2 { color: #ff0055; text-shadow: 0 0 10px #ff0055; margin-bottom: 20px; }
        
        .score-board { font-size: 1.5rem; margin-bottom: 20px; color: #fff; }
        
        .game-area {
            width: 300px;
            height: 300px;
            background: #111;
            border: 2px solid #ff0055;
            border-radius: 10px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }

        .target {
            width: 50px;
            height: 50px;
            background: #ff0055;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 0 15px #ff0055;
            transition: transform 0.1s;
        }
        .target:active { transform: scale(0.8); }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 1. صندوق تسجيل الدخول -->
    <div class="login-box" id="loginBox">
        <h2>🔐 دخول آمن</h2>
        <div class="input-group">
            <label>اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسمك">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور">
        </div>
        <button class="btn" onclick="checkLogin()">تسجيل الدخول</button>
    </div>

    <!-- 2. شاشة النجاح -->
    <div class="success-screen" id="successScreen">
        <h1>نجحت يا وحش! 😈</h1>
        <p>تم اختراق النظام بنجاح 👑</p>
    </div>

    <!-- 3. اللعبة -->
    <div class="game-screen" id="gameScreen">
        <h2>🎯 اصطد الهدف</h2>
        <div class="score-board">النقاط: <span id="score">0</span></div>
        <div class="game-area" id="gameArea">
            <div class="target" id="target" style="display: none;">💀</div>
        </div>
    </div>

    <script>
        // كلمة المرور السرية
        const SECRET_USER = "osaid";
        const SECRET_PASS = "osaid12345678";

        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === SECRET_USER && pass === SECRET_PASS) {
                // إخفاء شاشة الدخول وإظهار النجاح
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('successScreen').style.display = 'block';

                // بعد 2 ثانية، أظهر اللعبة
                setTimeout(() => {
                    document.getElementById('successScreen').style.display = 'none';
                    document.getElementById('gameScreen').style.display = 'block';
                    startGame();
                }, 2000);
            } else {
                alert("❌ اسم المستخدم أو كلمة المرور غير صحيحة يا وحش!");
            }
        }

        // --- منطق اللعبة ---
        let score = 0;
        let gameInterval;

        function startGame() {
            const target = document.getElementById('target');
            target.style.display = 'flex';
            moveTarget();

            // Target moves every 1 second
            gameInterval = setInterval(moveTarget, 1000);

            target.onclick = () => {
                score++;
                document.getElementById('score').innerText = score;
                moveTarget();
            };
        }

        function moveTarget() {
            const target = document.getElementById('target');
            const area = document.getElementById('gameArea');
            const maxX = area.clientWidth - 50;
            const maxY = area.clientHeight - 50;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';
        }
    </script>

</body>
</html>
